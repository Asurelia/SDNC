[project]
name = "sdnc"
version = "0.1.0"
description = "Sparse Dynamic Neural Circuits - Bio-inspired sparse liquid neural architecture"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "ncps>=1.0",
    "numpy",
    "open-clip-torch",
    "torchvision",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "matplotlib",
]
directml = [
    "torch-directml",
]
sync = [
    "convex",
]
datasets = [
    "datasets",
    "pillow",
]

[project.scripts]
sdnc-agent = "sdnc.agent.cli:main"
sdnc-eval = "sdnc.agent.eval:main"
sdnc-web = "sdnc.agent.web:main"
sdnc-speech-train = "sdnc.agent.speech_training:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
