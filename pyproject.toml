[project]
name = "sdnc"
version = "0.1.0"
description = "Sparse Dynamic Neural Circuits - Bio-inspired sparse liquid neural architecture"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "ncps>=1.0",
    "numpy",
    "open-clip-torch",
    "torchvision",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "matplotlib",
]
directml = [
    "torch-directml",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
