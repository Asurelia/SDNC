[project]
name = "brain-hybrid"
version = "0.2.0"
description = "Brain-inspired hybrid architecture : Qwen2.5-VL + CfC + SNN + STDP + SDM"
requires-python = ">=3.11"

dependencies = [
    "torch>=2.2",
    "transformers>=4.45",
    "ncps>=1.0",
    "snntorch>=0.9",
    "accelerate>=0.27",
    "qwen-vl-utils>=0.0.8",
    "numpy",
    "tqdm",
    "Pillow",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "jupyter", "ipywidgets", "gradio"]
quantized = ["bitsandbytes>=0.43"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"
